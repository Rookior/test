<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .progress-circle {
  --percent: 0;
  /* 百分数 */
  --size: 100px;
  /* 尺寸大小 */
  --border-width: 5px;
  /* 环宽（粗细） */
  --color: red;
  /* 主色 */
  --color2: green;
  /* 主色 */
  --inactive-color: #2a759c;
  /* 辅助色 */

  position: relative;
  width: var(--size);
  height: var(--size);
  border-radius: 50%;
}

/* SVG 容器 */
.progress-circle > svg {
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
}

/* 进度条圆环 */
.progress-circle circle {
  --r: calc((var(--size) - var(--border-width)) / 2);
  cx: calc(var(--size) / 2);
  cy: calc(var(--size) / 2);
  r: var(--r);
  fill: none;
  stroke-width: var(--border-width);
  stroke-linecap: round;
  transition: stroke-dasharray 0.4s linear, stroke 0.3s;
}

/* 优化：进度为0时隐藏进度条 */
/* .progress-value {
  opacity: calc(var(--percent) / 100);
} */
    </style>
</head>
<body>
  <div class="progress-circle progress-circle-month">
                  <svg>
                    <circle stroke="var(--inactive-color)" />
                    <circle
                      stroke="var(--color2)"
                      class="progress-value"
                      style="stroke-dasharray: calc(2 * 3.141592653589793 * var(--r) * var(--percent) / 100), calc(2 * 3.141592653589793 * var(--r));"
                    />
                  </svg>
                </div>
    <div class="progress-circle progress-circle-year">
        <svg>
            <circle stroke="var(--inactive-color)" />
            <circle
                stroke="var(--color)"
                class="progress-value"
                style="
                    stroke-dasharray: calc(2 * 3.141592653589793 * var(--r) * var(--percent) / 100), calc(2 * 3.141592653589793 * var(--r));
                "
            />
        </svg>
    </div>
    <script>
      // 更新月年完成率
        const progressElMonth = document.querySelector('.progress-circle-month')
        const progressElYear = document.querySelector('.progress-circle-year')
        progressElMonth.style.setProperty('--percent', 20)
        progressElYear.style.setProperty('--percent', 50)
    </script>
</body>
</html>
